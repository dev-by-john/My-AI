<!DOCTYPE html>
<html>
    <head>
        <title>My AI</title>
        <link rel="stylesheet" href="my-ai.css"> 
        <script src="my-ai.js" defer></script>
    </head>

    <body>
            <header>
                <h1 class="app-name">My AI</h1>
                <h2 class="status">● Local AI</h2>
            </header>

            <div class="chat-area">
                
            </div>
            
            <div class="input">
                <div class="input-box">
                    <textarea class="input-area" placeholder="How can I help...."></textarea>
                    <div class="input-toolbar">
                        <p class="assistant-label">Offline Assistant</p>

                        <button class="mic-button">🎤</button>

                        <button class="stop-button">⏹️ Stop</button>

                        <button class="submit">Send</button>

                        <button class="memory-button">🧠</button>

                        <button class="history-button">📜</button>
                    </div>
                    <div class="memory-panel">

                    <div class="memory-header">
                        <h3>🧠 Long-Term Memory</h3>
                        <button class="close-memory">✕</button>
                    </div>
                
                    <div class="memory-list"></div>
                
                    <button class="clear-memory">
                        🗑️ Clear Memory
                    </button>
                
                    </div>
                    <div class="history-panel">

                    <div class="history-header">
                        <h3>📜 Conversation History</h3>
                        <button class="close-history">✕</button>
                    </div>
                
                    <div class="history-list"></div>
                
                    <button class="clear-history">
                        🧹 Clear History
                    </button>
                
                    </div>
                </div>
            </div>
    </body>
</html>
